<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة البقاء الاستراتيجية</title>
    <style>
        body { background: #09090b; color: #f4f4f5; font-family: Tahoma, sans-serif; margin: 0; padding: 10px; text-align: center; }
        .wrap { max-width: 400px; margin: auto; background: #18181b; padding: 12px; border-radius: 10px; border: 1px solid #27272a; }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-bottom: 10px; }
        .box { background: #27272a; padding: 8px; border-radius: 6px; font-size: 11px; }
        .box b { display: block; font-size: 13px; color: #38bdf8; margin-top: 2px; }
        .panel { background: #121214; padding: 8px; border-radius: 6px; margin-bottom: 8px; text-align: right; font-size: 12px; }
        .row { display: flex; justify-content: space-between; margin: 4px 0; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
        button { background: #2563eb; color: white; border: none; padding: 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; }
        button:active { background: #1d4ed8; }
        .main-btn { width: 100%; background: #16a34a; margin-top: 6px; }
        .log { background: #000; color: #a1a1aa; font-size: 10px; padding: 6px; border-radius: 6px; height: 75px; overflow-y: auto; text-align: right; margin-top: 8px; }
    </style>
</head>
<body>

<div class="wrap">
    <h3 style="margin:5px 0 10px 0; color:#38bdf8;">🛡️ استراتيجية البقاء الحية</h3>

    <div class="grid">
        <div class="box">اليوم <b id="d">1</b></div>
        <div class="box">الناجون <b id="s" style="color:#4ade80">6</b></div>
        <div class="box">التهديد <b id="t" style="color:#f87171">منخفض</b></div>
    </div>

    <div class="panel">
        <div style="font-weight:bold; color:#c084fc; margin-bottom:4px;">📊 الموارد والتحصينات</div>
        <div class="row"><span>🍖 الطعام:</span> <b id="food" style="color:#f87171">100</b></div>
        <div class="row"><span>⚡ الطاقة:</span> <b id="energy" style="color:#fbbf24">100</b></div>
        <div class="row"><span>🧱 الدفاع:</span> <b id="def" style="color:#38bdf8">50</b></div>
    </div>

    <div class="panel">
        <div style="font-weight:bold; color:#4ade80; margin-bottom:4px;">🗺️ أزرار الاستكشاف</div>
        <div class="btn-grid">
            <button onclick="action('ruins')">🏚️ الأنقاض (+طعام)</button>
            <button onclick="action('power')">⚙️ المولد (+طاقة)</button>
            <button onclick="action('defense')">🌲 الغابة (+دفاع)</button>
            <button onclick="action('scout')">🔭 الاستطلاع</button>
        </div>
    </div>

    <button class="main-btn" onclick="nextDay()">إنهاء اليوم وبدء دورة جديدة ⏳</button>

    <div class="log" id="consoleLog">
        [النظام]: تم تشغيل اللعبة بنجاح. اضغط الأزرار الآن لتتفاعل الأرقام فوراً.
    </div>
</div>

<script>
    let game = { day: 1, survivors: 6, food: 100, energy: 100, defense: 50, threat: "منخفض" };

    function log(msg) {
        let box = document.getElementById("consoleLog");
        box.innerHTML += `<br>[يوم ${game.day}] ${msg}`;
        box.scrollTop = box.scrollHeight;
    }

    function update() {
        document.getElementById("d").innerText = game.day;
        document.getElementById("s").innerText = game.survivors;
        document.getElementById("t").innerText = game.threat;
        document.getElementById("food").innerText = game.food;
        document.getElementById("energy").innerText = game.energy;
        document.getElementById("def").innerText = game.defense;
    }

    function action(type) {
        if (game.energy < 15) {
            log("❌ الطاقة منخفضة جداً!");
            return;
        }
        if (type === 'ruins') {
            game.energy -= 15;
            let f = 15;
            game.food += f;
            log(`🔍 الأنقاض: جمعت ${f} وحدة طعام.`);
        } else if (type === 'power') {
            game.energy = Math.min(100, game.energy + 20);
            log(`⚙️ المولد: تم توليد طاقة إضافية.`);
        } else if (type === 'defense') {
            game.energy -= 15;
            game.defense += 10;
            log(`🌲 الغابة: تم جلب أخشاب وتدعيم السور.`);
        } else if (type === 'scout') {
            game.threat = "متوسط وخطير";
            log(`🔭 الاستطلاع: رصد تحركات مريبة في الخارج.`);
        }
        update();
    }

    function nextDay() {
        game.day++;
        game.food -= game.survivors * 3;
        game.energy = 100;
        log(`🌅 بدأ اليوم الجديد. استهلك الناجون المؤن.`);
        
        if (game.food <= 0) {
            game.food = 0;
            game.survivors = Math.max(0, game.survivors - 1);
            log(`⚠️ مجاعة! بدأ الناجون يفقدون حياتهم.`);
        }
        update();
    }
</script>

</body>
</html>
