<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ملجأ البقاء: العزلة الكبرى</title>
    <style>
        body { background: #0b0b0d; color: #f1f1f1; font-family: Tahoma, sans-serif; padding: 12px; margin: 0; text-align: center; }
        .container { max-width: 440px; margin: auto; background: #16161a; padding: 16px; border-radius: 14px; border: 1px solid #2a2a35; box-shadow: 0 4px 20px rgba(0,0,0,0.6); }
        .header { display: flex; justify-content: space-between; background: #1f1f26; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; font-size: 14px; font-weight: bold; }
        .stat-card { background: #22222c; padding: 10px; border-radius: 8px; margin: 8px 0; text-align: right; border-right: 4px solid #3b82f6; }
        .event-box { background: #2b1d1d; border: 1px solid #ef4444; padding: 12px; border-radius: 8px; margin: 12px 0; text-align: right; display: none; }
        button { background: #3b82f6; color: #fff; border: none; padding: 8px 14px; font-size: 13px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 6px; }
        button:active { background: #2563eb; }
        .btn-danger { background: #ef4444; }
        .btn-danger:active { background: #dc2626; }
        .log-box { background: #111114; padding: 8px; border-radius: 6px; font-size: 12px; color: #9ca3af; height: 70px; overflow-y: auto; text-align: right; margin-top: 10px; border: 1px solid #222; }
    </style>
</head>
<body>

<div class="container">
    <h2>ملجأ البقاء: العزلة</h2>
    
    <div class="header">
        <span>اليوم: <span id="day">1</span></span>
        <span>الناجون: <span id="survivors">5</span></span>
    </div>

    <div class="stat-card">
        <div>🍖 الطعام: <span id="food">60</span></div>
        <div>⚡ الطاقة: <span id="energy">80</span></div>
        <div>🛡️ الدفاع: <span id="defense">30</span></div>
    </div>

    <div id="eventBox" class="event-box">
        <div id="eventText" style="font-weight: bold; margin-bottom: 8px;">حدث طارئ!</div>
        <button id="btnChoice1" onclick="handleEventChoice(1)">إجراء أول</button>
        <button id="btnChoice2" onclick="handleEventChoice(2)" class="btn-danger">إجراء ثاني</button>
    </div>

    <div class="stat-card" style="border-right-color: #10b981;">
        <b>إدارة المهام اليومية</b>
        <div style="font-size: 13px; color: #d1d5db; margin: 6px 0;">أرسل ناجين للبحث عن موارد خارج الملجأ.</div>
        <button onclick="scavenge()">إرسال فريق استطلاع (تکلفة طاقة)</button>
    </div>

    <div class="log-box" id="logBox">
        [00:00] تم تأسيس الملجأ بنجاح وبدء العد التنازلي للبقاء.
    </div>
</div>

<script>
    let day = 1;
    let survivors = 5;
    let food = 60;
    let energy = 80;
    let defense = 30;
    let currentEvent = null;

    const eventsList = [
        { text: "هجوم لصوص على السور الخارجي للملجأ!", c1: "الدفاع بقوة (-طاقة)", c2: "التفاوض وإعطائهم طعام", type: "attack" },
        { text: "وجد فريق الاستطلاع مستودع أدوية ومؤن مهجور.", c1: "نهب الكل (+طعام)", c2: "بحذر وتأمين المكان (+دفاع)", type: "loot" },
        { text: "انضم ناجٍ تائه إلى البوابة يبحث عن مأوى.", c1: "قبوله (+ناجي)", c2: "رفضه حفاظاً على الموارد", type: "survivor" }
    ];

    const gameLoop = setInterval(() => {
        food -= survivors * 1.5;
        energy -= survivors * 1;
        
        if (food <= 0 || energy <= 0) {
            food = Math.max(0, food);
            energy = Math.max(0, energy);
            log("تحذير: نفدت المؤن وبدأ الناجون بالهلاك!");
            survivors = Math.max(0, survivors - 1);
        }

        if (Math.random() < 0.25 && !currentEvent) {
            triggerRandomEvent();
        }

        updateUI();
    }, 5000);

    function updateUI() {
        document.getElementById("day").innerText = day;
        document.getElementById("survivors").innerText = survivors;
        document.getElementById("food").innerText = Math.floor(food);
        document.getElementById("energy").innerText = Math.floor(energy);
        document.getElementById("defense").innerText = defense;
        if(survivors <= 0) {
            clearInterval(gameLoop);
            log("انتهت اللعبة: مات الجميع.");
        }
    }

    function log(txt) {
        let box = document.getElementById("logBox");
        box.innerHTML += `<br>[يوم ${day}] ${txt}`;
        box.scrollTop = box.scrollHeight;
    }

    function scavenge() {
        if (energy < 15) { log("الطاقة منخفضة جداً للاستطلاع!"); return; }
        energy -= 15;
        let found = Math.floor(Math.random() * 20) + 10;
        food += found;
        log(`عادت فرقة الاستطلاع ومعها ${found} وحدة طعام.`);
        day++;
        updateUI();
    }

    function triggerRandomEvent() {
        currentEvent = eventsList[Math.floor(Math.random() * eventsList.length)];
        document.getElementById("eventText").innerText = currentEvent.text;
        document.getElementById("btnChoice1").innerText = currentEvent.c1;
        document.getElementById("btnChoice2").innerText = currentEvent.c2;
        document.getElementById("eventBox").style.display = "block";
    }

    function handleEventChoice(choice) {
        let box = document.getElementById("eventBox");
        box.style.display = "none";
        
        if (currentEvent.type === "attack") {
            if (choice === 1) {
                energy -= 20;
                log("تم صصد الهجوم بنجاح وتكبيدهم خسائر.");
            } else {
                food -= 20;
                log("تم دفع الجزية من الطعام لشراء سلامتهم.");
            }
        } else if (currentEvent.type === "loot") {
            if (choice === 1) {
                food += 35;
                log("حصلت على مؤن وفيرة من المستودع.");
            } else {
                defense += 15;
                log("استفدت من الحطام لتقوية دفاعات السور.");
            }
        } else if (currentEvent.type === "survivor") {
            if (choice === 1) {
                survivors++;
                log("انضم ناجٍ جديد إلى طاقم الملجأ.");
            } else {
                log("تم رفض الناجي وغادر المنطقة.");
            }
        }
        currentEvent = null;
        updateUI();
    }
</script>

</body>
</html>
