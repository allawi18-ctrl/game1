<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>استراتيجية البقاء: الملجأ الأخير v2</title>
    <style>
        * { box-sizing: border-box; }
        body { background: #050507; color: #f1f5f9; font-family: Tahoma, sans-serif; margin: 0; padding: 10px; text-align: center; }
        .box { max-width: 420px; margin: auto; background: #121218; padding: 12px; border-radius: 12px; border: 1px solid #262636; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
        h3 { margin: 4px 0 10px 0; color: #38bdf8; font-size: 15px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 8px; }
        .card { background: #1a1a24; padding: 6px; border-radius: 6px; font-size: 11px; border: 1px solid #2e2e42; }
        .card b { display: block; font-size: 13px; margin-top: 2px; color: #34d399; }
        .panel { background: #181822; border: 1px solid #2a2a3d; padding: 8px; border-radius: 6px; margin-bottom: 8px; text-align: right; }
        .row { display: flex; justify-content: space-between; font-size: 12px; margin: 5px 0; padding: 4px 6px; background: #111117; border-radius: 4px; }
        .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px; }
        .m-btn { background: #1f1f33; border: 1px solid #3b3b5c; color: #fff; padding: 10px; border-radius: 6px; cursor: pointer; text-align: right; font-size: 11px; width: 100%; }
        .m-btn:active { background: #2563eb; }
        .m-btn span { display: block; color: #fbbf24; font-size: 12px; font-weight: bold; margin-bottom: 2px; }
        .big-btn { width: 100%; background: #0284c7; color: #fff; border: none; padding: 10px; font-size: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 6px; }
        .big-btn:active { background: #0369a1; }
        .log { background: #08080c; border: 1px solid #1a1a26; color: #94a3b8; font-size: 10px; padding: 6px; border-radius: 6px; height: 80px; overflow-y: auto; text-align: right; margin-top: 8px; line-height: 1.3; }
    </style>
</head>
<body>

<div class="box">
    <h3>🛡️ لعبة البقاء: محرك الملجأ</h3>

    <div class="grid-3">
        <div class="card">اليوم <b id="uiDay">1</b></div>
        <div class="card">الناجون <b id="uiSurvivors" style="color:#60a5fa">6</b></div>
        <div class="card">التهديد <b id="uiThreat" style="color:#f87171">منخفض</b></div>
    </div>

    <div class="panel">
        <div style="font-size:11px; font-weight:bold; color:#a855f7; margin-bottom:4px;">📊 الموارد الحية</div>
        <div class="row"><span>🍖 الطعام:</span> <b id="uiFood" style="color:#f87171">100</b></div>
        <div class="row"><span>⚡ الطاقة:</span> <b id="uiEnergy" style="color:#fbbf24">100</b></div>
        <div class="row"><span>🧱 الدفاع:</span> <b id="uiDefense" style="color:#38bdf8">50</b></div>
    </div>

    <div class="panel">
        <div style="font-size:11px; font-weight:bold; color:#22c55e; margin-bottom:4px;">🗺️ خريطة الاستكشاف</div>
        <div class="btn-grid">
            <button class="m-btn" onclick="doAction('ruins')"><span>🏚️ الأنقاض</span>تجميع طعام ومؤن</button>
            <button class="m-btn" onclick="doAction('power')"><span>⚙️ المولد</span>إصلاح وتوليد طاقة</button>
            <button class="m-btn" onclick="doAction('defense')"><span>🌲 الغابة</span>تقوية السور والدفاع</button>
            <button class="m-btn" onclick="doAction('scout')"><span>🔭 الاستطلاع</span>كشف حالة الخطر</button>
        </div>
    </div>

    <button class="big-btn" onclick="nextCycle()">إنهاء اليوم والتقدم للأمام ⏳</button>

    <div class="log" id="uiLog">
        [النظام]: تم تشغيل اللعبة بنجاح. اضغط على أزرار الخريطة لتتفاعل الأرقام فوراً.
    </div>
</div>

<script>
    let state = { day: 1, survivors: 6, food: 100, energy: 100, defense: 50, threat: "منخفض" };

    function addLog(text) {
        let box = document.getElementById("uiLog");
        box.innerHTML += `<br>[يوم ${state.day}] ${text}`;
        box.scrollTop = box.scrollHeight;
    }

    function updateView() {
        document.getElementById("uiDay").innerText = state.day;
        document.getElementById("uiSurvivors").innerText = state.survivors;
        document.getElementById("uiThreat").innerText = state.threat;
        document.getElementById("uiFood").innerText = state.food;
        document.getElementById("uiEnergy").innerText = state.energy;
        document.getElementById("uiDefense").innerText = state.defense;
    }

    function doAction(type) {
        if (state.energy < 15) {
            addLog("❌ الطاقة منخفضة جداً! استرح أو أنهِ اليوم.");
            return;
        }

        if (type === 'ruins') {
            state.energy -= 15;
            let f = Math.floor(Math.random() * 20) + 10;
            state.food += f;
            addLog(`🔍 عاد الفريق من الأنقاض ومعه ${f} طعام.`);
        } else if (type === 'power') {
            state.energy -= 15;
            let p = Math.floor(Math.random() * 25) + 10;
            state.energy = Math.min(100, state.energy + p);
            addLog(`⚙️ تم إصلاح المولد وزيادة الطاقة بقيمة +${p}.`);
        } else if (type === 'defense') {
            state.energy -= 15;
            let d = Math.floor(Math.random() * 15) + 5;
            state.defense += d;
            addLog(`🌲 تم جلب أخشاب وتدعيم السور بـ +${d} دفاع.`);
        } else if (type === 'scout') {
            state.energy -= 5;
            state.threat = Math.random() > 0.5 ? "متوسط" : "مرتفع وخطير";
            addLog(`🔭 تقرير الاستطلاع: مستوى التهديد الخارجي (${state.threat}).`);
        }
        updateView();
    }

    function nextCycle() {
        state.day++;
        let consumed = state.survivors * 4;
        state.food -= consumed;
        state.energy = Math.min(100, state.energy + 25);

        addLog(`🌅 بدأ اليوم الجديد. استهلك الناجون ${consumed} وحدة طعام.`);

        if (state.food <= 0) {
            state.food = 0;
            state.survivors = Math.max(0, state.survivors - 1);
            addLog("⚠️ تحذير: نفد الطعام وبدأ الناجون بالموت جوعاً!");
        }

        if (Math.random() < 0.4) {
            let dmg = Math.floor(Math.random() * 15) + 5;
            state.defense -= dmg;
            addLog(`⚔️ هجوم مباغت من اللصوص! تضررت التحصينات بـ ${dmg} نقطة.`);
        }

        if (state.survivors <= 0) {
            addLog("💀 انتهت اللعبة: سقط الملجأ ومات الجميع.");
            alert("انتهت اللعبة! سقط الملجأ.");
        }
        updateView();
    }
</script>

</body>
</html>
